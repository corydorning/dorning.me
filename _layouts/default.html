<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  {% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
  {% if page.share_image %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ page.share_site | default: page.title | escape }}">
  <meta property="og:title" content="{{ page.share_title | default: page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ page.share_url }}">
  <meta property="og:image" content="{{ page.share_image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ page.share_title | default: page.title | escape }}">
  <meta name="twitter:card" content="summary_large_image">
  {% endif %}
  {% if page.app_store_id %}<meta name="apple-itunes-app" content="app-id={{ page.app_store_id }}">{% endif %}
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
</head>
<body>
  <main class="container-lg px-3 my-5 markdown-body">
    {{ content }}
  </main>
</body>
</html>
