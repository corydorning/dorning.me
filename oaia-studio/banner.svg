  <path d="M74 474h88" stroke="#a8d974" stroke-width="5"/>
  <text x="72" y="582" fill="#c2cdbb" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="1.5">GENERATE / EDIT / EXPLORE</text>

