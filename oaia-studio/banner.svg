<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OAIA Studio</title>
  <desc id="desc">A charcoal studio wordmark beside overlapping image canvases, with an original illustration of a sunlit coast in green, blue, and warm coral.</desc>
  <defs>
    <linearGradient id="backdrop" x2="1" y2="1">
      <stop stop-color="#151d1a"/>
      <stop offset="1" stop-color="#233b30"/>
    </linearGradient>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#f2a87c"/>
      <stop offset="1" stop-color="#f5d7a4"/>
    </linearGradient>
    <linearGradient id="water" x2="0.85" y2="1">
      <stop stop-color="#379b9a"/>
      <stop offset="1" stop-color="#13515c"/>
    </linearGradient>
    <clipPath id="canvas"><rect width="424" height="370" rx="5"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#08120e" flood-opacity=".48"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#backdrop)"/>
  <path d="M0 552H1200" stroke="#f4efe1" stroke-opacity=".08"/>

